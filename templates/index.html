<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Rütbe Tahmin Sistemi</title>
    <style>
        body {
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #111; /* Siyah arka plan (resim sığdığında alt/üst boşluklar bu renk olacak) */
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('/static/arkaplan.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover; /* Bilgisayarlar için ekranı tam kaplama (sağdan soldan kesebilir) */
            z-index: -1; 
        }

        /* 📱 TELEFONLAR İÇİN "HİÇBİR YERİ KESME" KALKANI */
        @media (max-width: 768px) {
            body::before {
                background-size: contain; /* Resmi kesmek yerine tamamını ekrana küçülterek sığdırır */
                background-position: top center; /* Resmi ekranın en üstüne hizalar */
            }
        }

        .container {
            background-color: rgba(31, 35, 38, 0.9);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(255, 70, 85, 0.3);
            border-top: 5px solid #ff4655;
            width: 90%;
            max-width: 350px;
            box-sizing: border-box;
            margin-top: 20px; /* Form çok yukarı yapışmasın diye boşluk */
        }
        h2 {
            text-align: center;
            color: #ff4655;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background-color: #2a2e31;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #ff4655;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff4655;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #d63643;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #2a2e31;
            border-left: 4px solid #ff4655;
            text-align: center;
            border-radius: 4px;
        }
        .rank-text {
            color: #ff4655;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Rank Predictor</h2>
    <form action="/predict" method="POST">
        <div class="form-group">
            <label>KDA Oranı (Örn: 1.25):</label>
            <input type="number" step="0.01" name="kda" required>
        </div>
        <div class="form-group">
            <label>Toplam Hasar (Damage):</label>
            <input type="number" name="damage" required>
        </div>
        <div class="form-group">
            <label>Kafadan Vurma (Headshots):</label>
            <input type="number" name="headshots" required>
        </div>
        <div class="form-group">
            <label>Asist Sayısı (Assists):</label>
            <input type="number" name="assists" required>
        </div>
        <button type="submit">Rütbeyi Tahmin Et</button>
    </form>

    {% if tahmin %}
    <div class="result">
        Tahmin Edilen Rütbe:<br>
        <span class="rank-text">{{ tahmin }}</span>
    </div>
    {% endif %}
</div>

</body>
</html>
