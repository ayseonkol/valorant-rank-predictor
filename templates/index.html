<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hantavirüs Teşhis Analizi</title>
    <style>
        /* MOBİLDE RESMİN DÜZGÜN DURMASINI SAĞLAYAN ÖZEL KATMAN */
        .arka-plan-katmani {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Arka plan resmin /static/arka-plan.jpg olarak kalmalı */
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), 
                        url('/static/arka-plan.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1; /* İçeriğin arkasında kalması için */
        }

        body { 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 15px;
            box-sizing: border-box;
        }

        .container { 
            max-width: 480px; 
            width: 100%;
            background: rgba(255, 255, 255, 0.96); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            box-sizing: border-box;
        }

        h2 { 
            color: #d32f2f; 
            text-align: center; 
            margin-bottom: 25px; 
            font-weight: 800;
            text-transform: uppercase;
            font-size: 22px;
        }

        .input-group { margin-bottom: 18px; }
        
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 14px; }

        input[type="number"], select { 
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; 
            box-sizing: border-box; font-size: 15px; background: #fff;
        }

        .symptoms-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            background: #f9f9f9; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #eee;
        }

        .symptom-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #444; }

        button { 
            width: 100%; background: #d32f2f; color: white; padding: 15px; border: none; 
            border-radius: 10px; margin-top: 20px; cursor: pointer; font-size: 16px; 
            font-weight: bold; transition: 0.3s;
        }

        button:hover { background: #b71c1c; transform: scale(1.02); }

        .result-box { 
            margin-top: 25px; padding: 18px; border-radius: 12px; text-align: center; 
            font-size: 17px; font-weight: bold;
        }

        .positive { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .negative { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }

        /* MOBİL TELEFONLAR İÇİN DOKUNUŞ */
        @media (max-width: 480px) {
            .container { padding: 20px 15px; }
            .symptoms-grid { grid-template-columns: 1fr; } /* Mobilde semptomlar alt alta */
            h2 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="arka-plan-katmani"></div>

    <div class="container">
        <h2>Hantavirüs Analizi</h2>
        <form action="/predict" method="post">
            <div class="input-group">
                <label>Hasta Yaşı:</label>
                <input type="number" name="Age" placeholder="Yaş giriniz" required min="1">
            </div>
            
            <div class="input-group">
                <label>Cinsiyet:</label>
                <select name="Gender" required>
                    <option value="" disabled selected>Seçiniz...</option>
                    <option value="M">Erkek</option>
                    <option value="F">Kadın</option>
                </select>
            </div>

            <div class="input-group">
                <label>Belirtiler:</label>
                <div class="symptoms-grid">
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Fever"> Ateş</div>
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Muscle Aches"> Kas Ağrısı</div>
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Fatigue"> Halsizlik</div>
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Headache"> Baş Ağrısı</div>
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Nausea"> Mide Bulantısı</div>
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Abdominal Pain"> Karın Ağrısı</div>
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Cough"> Öksürük</div>
                    <div class="symptom-item"><input type="checkbox" name="symptoms" value="Breath"> Nefes Darlığı</div>
                </div>
            </div>

            <button type="submit">Analizi Başlat</button>
        </form>

        {% if prediction_text %}
            <div class="result-box {% if 'POZİTİF' in prediction_text %}positive{% else %}negative{% endif %}">
                {{ prediction_text }}
            </div>
        {% endif %}
    </div>
</body>
</html>
